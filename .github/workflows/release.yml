name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NAME: Tab Dedup
  # Files shipped in the extension zip (no tests, package.json or CI config).
  FILES: manifest.json background.js popup.html popup.css popup.js lib icons README.md

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Check tag matches manifest version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build extension zip
        id: zip
        run: |
          zip_name="${GITHUB_REPOSITORY#*/}-${{ steps.version.outputs.version }}.zip"
          zip -r -X "$zip_name" $FILES
          unzip -l "$zip_name"
          echo "name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.zip.outputs.name }}
        run: |
          flags=()
          # 0.x releases are marked as pre-release until 1.0.0.
          [[ "$VERSION" == 0.* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$NAME $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
